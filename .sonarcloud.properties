# The Gallery *.Host.cs parts hold the framework-specific event handlers and controls of each Gallery (ADR 0017, phase 17).
sonar.cpd.exclusions=samples/**/*.Host.cs
# The golden samples are fixtures of vscode-colorize-tests (and short samples written in the same spirit): code that exists to
# be tokenized, with deliberate oddities (unknown CSS properties, http:// URLs, rand() ...), never run or shipped.
sonar.exclusions=tests/LoomEditor.TextMate.Tests/Golden/*/sample.*
