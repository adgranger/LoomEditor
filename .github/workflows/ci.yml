# Continuous integration for LoomEditor.
# GitHub Actions sets CI=true, which turns warnings into errors (see Directory.Build.props).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    needs: [native]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Windows library comes from the native job (cached there); without it the build compiles it (CMake + MSVC).
      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      - name: Restore
        run: dotnet restore LoomEditor.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build LoomEditor.slnx -c Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --solution LoomEditor.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/test-results/**/*.cobertura.xml

  # The projects that must run anywhere .NET runs (LoomEditor.Portable.slnf): a Windows-only assumption fails here.
  portable:
    name: Portable projects (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the Oniguruma library
        uses: actions/download-artifact@v7
        with:
          name: oniguruma-${{ matrix.rid }}
          path: artifacts/native

      - name: Build (Release, warnings as errors)
        run: dotnet build LoomEditor.Portable.slnf -c Release

      - name: Test
        run: dotnet test --solution LoomEditor.Portable.slnf -c Release --no-build

  pack:
    name: Pack NuGet packages
    # Not on pull requests: the release workflow (dry run) packs and tests the packages.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [build-and-test, native]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Every platform, so that the TextMate package carries all six runtimes/<rid>/native folders.
      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      - name: Self-test the release scripts
        shell: pwsh
        run: |
          ./eng/Get-ReleaseVersion.ps1 -SelfTest
          ./eng/Get-ReleaseNotes.ps1 -SelfTest

      # Packages are built but NOT published: publishing is a manual, reviewed step (docs/RELEASING.md).
      - name: Pack and test the packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages

  native:
    name: Oniguruma (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, arch: x64 }
          - { rid: win-arm64, os: windows-latest, arch: ARM64 }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx, os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Cache the library
        id: cache
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: oniguruma-${{ matrix.rid }}-${{ hashFiles('src/native/oniguruma/build.ps1', 'src/native/oniguruma/build.sh') }}

      - name: Build onig.dll
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./src/native/oniguruma/build.ps1 -Architecture ${{ matrix.arch }}

      - name: Build libonig
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: bash src/native/oniguruma/build.sh --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: oniguruma-${{ matrix.rid }}
          path: artifacts/native

  aot-smoke-test:
    name: Native AOT publish (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [native]
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      # Any trimming/AOT warning (IL2xxx, IL3xxx) fails the build: CI=true enables TreatWarningsAsErrors,
      # and the log is also scanned in case a tool reports warnings without honoring that setting.
      - name: Publish LoomEditor.Gallery with PublishAot
        shell: pwsh
        run: |
          dotnet publish samples/LoomEditor.Gallery -c Release -r ${{ matrix.rid }} -p:PublishAot=true -warnaserror 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = Select-String -Path publish.log -Pattern 'warning (IL|AOT|CS|CA|NETSDK)\d+'
          if ($warnings) { $warnings; throw 'The AOT publish produced warnings.' }

      - name: Check the published app contains its XAML resources
        shell: pwsh
        run: |
          $publish = 'samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish'
          foreach ($file in 'LoomEditor.Gallery.exe', 'LoomEditor.Gallery.pri') {
            if (-not (Test-Path (Join-Path $publish $file))) { throw "Missing $file in $publish" }
          }

      - name: Start the app (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = 'samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/win-x64/publish/LoomEditor.Gallery.exe'
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            # Exit code -1073741189 (0xC000027B) is a stowed exception: the Application log names the faulting module and exception.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like '*LoomEditor.Gallery*' } | Select-Object -First 5 | ForEach-Object { $_.Message }
            throw "The AOT app exited at startup with code $($process.ExitCode)."
          }
          Stop-Process $process

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.rid }}
          path: samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish

  # The Avalonia Gallery published with Native AOT on the three desktop systems (docs/tasks/phase-15/P15-32). osx-x64 and linux-arm64 are packed but not published here.
  aot-avalonia:
    name: Avalonia Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: [native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, native: onig.dll }
          - { rid: linux-x64, os: ubuntu-latest, native: libonig.so }
          - { rid: osx-arm64, os: macos-latest, native: libonig.dylib }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download the Oniguruma libraries
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      - name: Install the Linux display and font packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfontconfig1

      # Build first, then publish with --no-build: a publish that recompiles drops the compiled XAML of an Avalonia app.
      # Any trimming/AOT warning (IL2xxx, IL3xxx) fails the build (CI=true enables TreatWarningsAsErrors); the log is also scanned.
      - name: Publish LoomEditor.Gallery.Avalonia with PublishAot
        shell: pwsh
        run: |
          dotnet build samples/LoomEditor.Gallery.Avalonia -c Release -r ${{ matrix.rid }} -p:PublishAot=true -warnaserror 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish samples/LoomEditor.Gallery.Avalonia -c Release -r ${{ matrix.rid }} -p:PublishAot=true -warnaserror --no-build 2>&1 | Tee-Object -FilePath publish.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = Select-String -Path publish.log -Pattern 'warning (IL|AOT|CS|CA|NETSDK)\d+'
          if ($warnings) { $warnings; throw 'The AOT publish produced warnings.' }

      - name: Check the published app and run its self-checks
        shell: pwsh
        run: |
          $publish = (Resolve-Path 'samples/LoomEditor.Gallery.Avalonia/bin/Release/net11.0/${{ matrix.rid }}/publish').Path
          $exe = Join-Path $publish ('LoomEditor.Gallery.Avalonia' + ('${{ runner.os }}' -eq 'Windows' ? '.exe' : ''))
          foreach ($file in $exe, (Join-Path $publish '${{ matrix.native }}')) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }
          if ('${{ runner.os }}' -ne 'Windows') { chmod +x $exe }
          # xvfb-run gives the app a display on Linux; the other systems have one.
          $launcher = '${{ runner.os }}' -eq 'Linux' ? @('xvfb-run', '-a', $exe) : @($exe)
          foreach ($check in 'text', 'diff', 'comments', 'hostapi') {
            $report = Join-Path $env:RUNNER_TEMP "$check-selfcheck.txt"
            & $launcher[0] @($launcher[1..($launcher.Count - 1)]) "--$check-selfcheck=$report"
            $code = $LASTEXITCODE
            if (Test-Path $report) { Get-Content $report | Select-Object -Last 3 }
            if ($code -ne 0) { throw "The $check self-check failed with exit code $code." }
          }

      - name: Start the app for 10 seconds
        shell: pwsh
        run: |
          $publish = (Resolve-Path 'samples/LoomEditor.Gallery.Avalonia/bin/Release/net11.0/${{ matrix.rid }}/publish').Path
          $exe = Join-Path $publish ('LoomEditor.Gallery.Avalonia' + ('${{ runner.os }}' -eq 'Windows' ? '.exe' : ''))
          $process = if ('${{ runner.os }}' -eq 'Linux') { Start-Process xvfb-run -ArgumentList '-a', $exe -PassThru } else { Start-Process $exe -PassThru }
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "The AOT app exited at startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-avalonia-${{ matrix.rid }}
          path: samples/LoomEditor.Gallery.Avalonia/bin/Release/net11.0/${{ matrix.rid }}/publish
