# Continuous integration for LoomEditor.
# GitHub Actions sets CI=true, which turns warnings into errors (see Directory.Build.props).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    needs: [native]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # onig.dll comes from the native job (cached there); without it the build compiles it (CMake + MSVC).
      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      - name: Restore
        run: dotnet restore LoomEditor.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build LoomEditor.slnx -c Release --no-restore

      - name: Test (with coverage)
        run: >
          dotnet test --solution LoomEditor.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/test-results/**/*.cobertura.xml

  pack:
    name: Pack NuGet packages
    # Not on pull requests: the release workflow (dry run) packs and tests the packages.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [build-and-test, native]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Both architectures, so that the TextMate package carries runtimes/win-x64 and runtimes/win-arm64.
      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      - name: Self-test the release scripts
        shell: pwsh
        run: |
          ./eng/Get-ReleaseVersion.ps1 -SelfTest
          ./eng/Get-ReleaseNotes.ps1 -SelfTest

      # Packages are built but NOT published: publishing is a manual, reviewed step (docs/RELEASING.md).
      - name: Pack and test the packages
        shell: pwsh
        run: ./eng/Test-Packages.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages

  native:
    name: Oniguruma (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v7

      - name: Cache onig.dll
        id: cache
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: oniguruma-${{ matrix.arch }}-${{ hashFiles('src/native/oniguruma/build.ps1') }}

      - name: Build onig.dll
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./src/native/oniguruma/build.ps1 -Architecture ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: oniguruma-${{ matrix.arch }}
          path: artifacts/native

  aot-smoke-test:
    name: Native AOT publish (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [native]
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download onig.dll
        uses: actions/download-artifact@v7
        with:
          pattern: oniguruma-*
          path: artifacts/native
          merge-multiple: true

      # Any trimming/AOT warning (IL2xxx, IL3xxx) fails the build: CI=true enables TreatWarningsAsErrors,
      # and the log is also scanned in case a tool reports warnings without honoring that setting.
      - name: Publish LoomEditor.Gallery with PublishAot
        shell: pwsh
        run: |
          dotnet publish samples/LoomEditor.Gallery -c Release -r ${{ matrix.rid }} -p:PublishAot=true -warnaserror 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = Select-String -Path publish.log -Pattern 'warning (IL|AOT|CS|CA|NETSDK)\d+'
          if ($warnings) { $warnings; throw 'The AOT publish produced warnings.' }

      - name: Check the published app contains its XAML resources
        shell: pwsh
        run: |
          $publish = 'samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish'
          foreach ($file in 'LoomEditor.Gallery.exe', 'LoomEditor.Gallery.pri') {
            if (-not (Test-Path (Join-Path $publish $file))) { throw "Missing $file in $publish" }
          }

      - name: Start the app (x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $exe = 'samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/win-x64/publish/LoomEditor.Gallery.exe'
          $process = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            # Exit code -1073741189 (0xC000027B) is a stowed exception: the Application log names the faulting module and exception.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like '*LoomEditor.Gallery*' } | Select-Object -First 5 | ForEach-Object { $_.Message }
            throw "The AOT app exited at startup with code $($process.ExitCode)."
          }
          Stop-Process $process

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.rid }}
          path: samples/LoomEditor.Gallery/bin/Release/net11.0-windows10.0.26100.0/${{ matrix.rid }}/publish
